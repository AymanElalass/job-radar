# Critères de veille. Chaque bloc [[recherche]] décrit une recherche, déclinée en
# une requête par couple mot-clé / département ; les offres de toutes les recherches
# sont dédoublonnées ensemble par identifiant.
[[recherche]]
# Un mot-clé peut être une expression de plusieurs mots ("alternance data") :
# l'API l'accepte telle quelle. La virgule, elle, y est interdite (elle sépare les
# mots-clés côté API) : utilisez plutôt une entrée de liste par mot-clé.
mots_cles = [
  "testeur", "recette", "QA",
  "support informatique", "helpdesk",
  "alternance data", "alternance développeur",
  "enseignant informatique", "formateur informatique",
  "développeur java", "développeur python", "data engineer",
]

# Départements recherchés. Liste vide = recherche sur toute la France,
# avec une seule requête par mot-clé.
departements = []

# Fenêtre de publication, en jours. Valeurs acceptées par l'API : 1, 3, 7, 14, 31.
publiee_depuis = 7

# Nombre de pages de 150 offres à parcourir par recherche.
# Les offres étant triées par date de création décroissante, la première page
# contient toujours les annonces les plus récentes.
pages_max = 2

# Le télétravail, partout en France. Un seul mot-clé : l'API rabat « 100% télétravail »,
# « full remote » et « full télétravail » sur le même concept que « télétravail » seul
# (5341 offres sur 7 jours dans les trois cas), les autres n'étaient que des requêtes
# en double. La fenêtre est raccourcie à 3 jours, ce qui réduit la perte sans la
# supprimer : mesuré à 1470 offres sur 3 jours pour 1050 récupérables (7 pages de
# 150). Seule une fenêtre d'un jour passe entièrement (824 offres), au prix d'une
# collecte quotidienne ; en l'état, la saturation est signalée à chaque collecte.
#
# « teletravail_complet » marque la provenance de ces offres : le pré-filtre ne
# gardera que celles dont l'intitulé ou la description annonce vraiment un poste
# entièrement à distance, une recherche par mot-clé ramenant surtout des offres
# hybrides. Une offre trouvée aussi par une recherche ci-dessus n'est pas concernée.
[[recherche]]
mots_cles = ["télétravail"]
publiee_depuis = 3
pages_max = 7
teletravail_complet = true

# Étape 2 : tri des offres par LLM.
[tri]
# Chemin du fichier Markdown de critères, volontairement hors du dépôt
# (il décrit votre profil). Voir criteres.example.md pour la structure.
criteres = "~/Documents/cv/criteres-tri.md"

# Modèle passé à `claude -p --model`.
modele = "sonnet"

# Nombre d'offres envoyées au modèle en une fois.
taille_lot = 20

# Délai maximal par lot, en secondes. Au-delà, le lot est abandonné et signalé,
# et les lots suivants partent quand même.
delai_max = 180

# Codes ROME retenus : un préfixe garde toute la famille, un code complet une
# seule fiche. M18 = systèmes d'information et de télécommunication (M1801 à
# M1810), K2107 = enseignement général du second degré, K2111 = formation
# professionnelle. Liste vide = pas de filtre.
codes_rome = ["M18", "K2107", "K2111"]

# Offres des canaux réservés aux travailleurs handicapés (« Talents Handicap »,
# handicap-job.com) : true les écarte au pré-filtre, false les conserve avec le
# drapeau rqth.
exclure_rqth = false
